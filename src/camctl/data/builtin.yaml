low-light:
  description: "Dark receptions / poor light. Normal profile (no Log), 1/50, f/1.8, Auto ISO."
  switch: Movie
  settings:
    gamma_display_assist: "Off"        # else a Log preset's S-Log3→709 view LUT tints the monitor
    exposure_program: Movie (M)
    movie_format: XAVC S 4K
    movie_frame_rate: 24p
