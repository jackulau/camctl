# Built-in presets. `settings` are applied over PTP (canonical keys from settings.py, or raw
# gphoto2 widget names). `manual` lists items the camera does not expose remotely — the
# apply report prints them as an on-camera checklist. Menu-only keys (log_shooting, log_gamut) are
# added to that checklist automatically — don't repeat them under `manual`.
#
# User presets: ~/.config/camctl/presets/*.yaml (same schema; same name overrides a built-in).

photo:
  description: "Default stills — portraits/events. RAW+JPEG, M + Auto ISO, AF-C, 1/250, f/2.8."
  switch: Photo
  settings:
    gamma_display_assist: "Off"        # else a Log preset's S-Log3→709 view LUT tints the monitor
    exposure_program: M
    image_quality: RAW+JPEG
    jpegquality: X.Fine
    shutter: 1/250
    aperture: 2.8
    iso: auto
    white_balance: auto
    metering: multi
    focus_mode: AF-C
    drive: continuous_mid
    steadyshot: "On"
    subject_recognition: "On"
    recognition_target: Human
    eye_select: Auto
    iso_auto_min: 100
    iso_auto_max: 6400
    picture_profile: "Off"
  manual:
    - "Mode dial → M, Photo/Movie/S&Q switch → Photo"
    - "One-time: MENU → Setup → Operation Customize → Different Set for Still/Mv → tick all 8 (Aperture, Shutter Speed, ISO, Exposure Comp., Metering, White Balance, Picture Profile, Focus Mode) — otherwise photo and movie share exposure/WB"
    - "RAW File Type → Lossless Compressed (L)"
    - "Focus Area → Wide, or Tracking: Spot M for single subjects"
    - "Anti-flicker Shoot → On under indoor LED/fluorescent lights"

photo-action:
  description: "Moving people / dancing. 1/500, f/2.8, Auto ISO, AF-C, Continuous Hi."
  switch: Photo
  settings:
    gamma_display_assist: "Off"        # else a Log preset's S-Log3→709 view LUT tints the monitor
    exposure_program: M
    image_quality: RAW+JPEG
    shutter: 1/500
    aperture: 2.8
    iso: auto
    white_balance: auto
    focus_mode: AF-C
    subject_recognition: "On"
    recognition_target: Human
    eye_select: Auto
    iso_auto_min: 100
    iso_auto_max: 6400
    drive: continuous_hi
  manual:
    - "Mode dial → M, switch → Photo"
    - "Subject Recognition → Human/Eye; Focus Area → Tracking: Wide or Zone"
    - "Go 1/1000 for fast action (sports, running kids)"

photo-group:
  description: "Group photos. f/5.6 so every face is sharp, 1/250, Auto ISO."
  switch: Photo
  settings:
    gamma_display_assist: "Off"        # else a Log preset's S-Log3→709 view LUT tints the monitor
    exposure_program: M
    image_quality: RAW+JPEG
    shutter: 1/250
    aperture: 5.6
    iso: auto
    white_balance: auto
    focus_mode: AF-C
    subject_recognition: "On"
    recognition_target: Human
    eye_select: Auto
    iso_auto_min: 100
    iso_auto_max: 6400
    drive: continuous_mid
  manual:
    - "Mode dial → M, switch → Photo"
    - "Focus Area → Wide; Subject Recognition → Human"

cinematic-24:
  description: "Best for color grading. 4K 24p, 1/50, 10-bit 4:2:2, S-Log3 / S-Gamut3.Cine, 5600K manual WB."
  switch: Movie
  settings:
    exposure_program: Movie (M)
    movie_format: XAVC S 4K
    movie_frame_rate: 24p
    movie_setting: 100M 4:2:2 10bit
    log_shooting: "On (Flexible ISO)"
    log_gamut: S-Gamut3.Cine
    monitor_lut: "On"                   # A7 V Log preview; Gamma Display Assist stays off (no double LUT)
    gamma_display_assist: "Off"
    subject_recognition: "On"
    recognition_target: Human
    shutter: 1/50
    aperture: 2.8
    iso: 800
    white_balance: color_temp
    color_temp: 5600
    focus_mode: AF-C
    imagestabilization: "On"
  manual:
    - "Mode dial → M, Photo/Movie/S&Q switch → Movie"
    - "One-time: MENU → Setup → Operation Customize → Different Set for Still/Mv → tick all 8 (Aperture, Shutter Speed, ISO, Exposure Comp., Metering, White Balance, Picture Profile, Focus Mode) — otherwise photo and movie share exposure/WB"
    - "Card: 100M 10-bit needs a V30+ SD card; 200M+ (XAVC S-I) needs V60/V90"
    - "Zebra → On, level 94+ or C1 at ~70% for skin; expose S-Log3 bright but never clip highlights"
    - "SteadyShot → Active when handheld, Standard/Off on tripod"
    - "Audio rec level: dialogue peaks around -12 dB, never touching 0 dB"
    - "Custom WB: if it errors, turn Log Shooting off, set custom WB, turn Log back on (Sony-documented quirk)"
  notes:
    - "Grade: S-Gamut3.Cine/S-Log3 → CST/Sony LUT → Rec.709 → exposure/WB → contrast → skin → look"
    - "Change exposure with a variable ND, not shutter. Keep 1/50 for natural motion blur."

slowmo-60:
  description: "B-roll slow motion. 4K 60p, 1/125, S-Log3 / S-Gamut3.Cine. 60p on a 24p timeline = 40% speed."
  switch: Movie
  settings:
    exposure_program: Movie (M)
    movie_format: XAVC S 4K
    movie_frame_rate: 60p
    movie_setting: 4:2:2 10bit          # A7 V XAVC S 4K 60p: 200M 4:2:2 10bit (100M 4:2:2 is 24/30p only)
    log_shooting: "On (Flexible ISO)"
    log_gamut: S-Gamut3.Cine
    monitor_lut: "On"                   # A7 V Log preview; Gamma Display Assist stays off (no double LUT)
    gamma_display_assist: "Off"
    subject_recognition: "On"
    recognition_target: Human
    shutter: 1/125
    aperture: 2.8
    iso: 800
    white_balance: color_temp
    color_temp: 5600
    focus_mode: AF-C
  manual:
    - "Mode dial → M, switch → Movie"
    - "For 120p use the S&Q position and 1/250 shutter"

easy-video:
  description: "Fast turnaround, no grading. 4K 24p, 1/50, standard look, 5600K. (30p → 1/60)"
  switch: Movie
  settings:
    gamma_display_assist: "Off"        # else a Log preset's S-Log3→709 view LUT tints the monitor
    exposure_program: Movie (M)
    movie_format: XAVC S 4K
    movie_frame_rate: 24p
    movie_setting: 100M 4:2:2 10bit
    log_shooting: "Off"
    subject_recognition: "On"
    recognition_target: Human
    shutter: 1/50
    aperture: 2.8
    iso: auto
    white_balance: color_temp
    color_temp: 5600
    focus_mode: AF-C
  manual:
    - "Mode dial → M, switch → Movie"
    - "Creative Look → ST (standard) or your finished look"
    - "10bit 4:2:2 still recommended even without Log"

event-ceremony:
  description: "Weddings / speeches / anything you can't reshoot. 4K24, 1/50, S-Log3, tripod, backup audio."
  switch: Movie
  settings:
    exposure_program: Movie (M)
    movie_format: XAVC S 4K
    movie_frame_rate: 24p
    movie_setting: 100M 4:2:2 10bit
    log_shooting: "On (Flexible ISO)"
    log_gamut: S-Gamut3.Cine
    monitor_lut: "On"                   # A7 V Log preview; Gamma Display Assist stays off (no double LUT)
    gamma_display_assist: "Off"
    subject_recognition: "On"
    recognition_target: Human
    shutter: 1/50
    aperture: 2.8
    iso: 800
    white_balance: color_temp
    color_temp: 5600
    focus_mode: AF-C
  manual:
    - "Mode dial → M, switch → Movie"
    - "Card: format it IN CAMERA before the event; check the remaining record time covers the whole ceremony"
    - "Tripod → SteadyShot Off/Standard"
    - "Second audio source (DJI mic recorder / lav) as backup; peaks near -12 dB"
  notes:
    - "Not comfortable grading Log? Use easy-video (or low-light in a dim venue) instead."

outdoor-cinematic:
  description: "Daylight cinematic. 4K24, 1/50, f/2, S-Log3, 5600K — control exposure with the variable ND."
  switch: Movie
  settings:
    exposure_program: Movie (M)
    movie_format: XAVC S 4K
    movie_frame_rate: 24p
    movie_setting: 100M 4:2:2 10bit
    log_shooting: "On (Flexible ISO)"
    log_gamut: S-Gamut3.Cine
    monitor_lut: "On"                   # A7 V Log preview; Gamma Display Assist stays off (no double LUT)
    gamma_display_assist: "Off"
    subject_recognition: "On"
    recognition_target: Human
    shutter: 1/50
    aperture: 2.0
    iso: 800
    white_balance: color_temp
    color_temp: 5600
    focus_mode: AF-C
  manual:
    - "Mode dial → M, switch → Movie"
    - "Rotate variable ND until zebras just stop showing on the sky/highlights"

talking-head:
  description: "Indoor talking-head/demo. 4K24, 1/50, f/2.8, manual WB, tripod, DJI mic."
  switch: Movie
  settings:
    exposure_program: Movie (M)
    movie_format: XAVC S 4K
    movie_frame_rate: 24p
    movie_setting: 100M 4:2:2 10bit
    log_shooting: "On (Flexible ISO)"
    log_gamut: S-Gamut3.Cine
    monitor_lut: "On"                   # A7 V Log preview; Gamma Display Assist stays off (no double LUT)
    gamma_display_assist: "Off"
    subject_recognition: "On"
    recognition_target: Human
    shutter: 1/50
    aperture: 2.8
    iso: 800
    white_balance: color_temp
    color_temp: 5600
    focus_mode: AF-C
  manual:
