[project]
name = "camctl"
version = "0.1.0"
description = "CLI + MCP server for cameras (Sony verified; Canon, Nikon, Fujifilm, Panasonic, OM System) over USB, Wi-Fi PTP/IP and Bluetooth LE"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "gphoto2>=2.5",
    "bleak>=0.22",
    # Unpinned on purpose: mcp_server.py imports mcp.server.mcpserver (2.x, FastMCP renamed MCPServer) and
    # falls back to mcp.server.fastmcp (1.x). Both majors are tested (1.2.0 and 2.2.0); uv.lock picks 2.x.
    "mcp>=1.2",
    "pyyaml>=6",
    "requests>=2.34.2",
    "pyusb>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/jackulau/camctl"
Issues = "https://github.com/jackulau/camctl/issues"

[project.scripts]
camctl = "camctl.cli:main"
camctl-mcp = "camctl.mcp_server:main"
# pre-rename names, kept so existing scripts and MCP registrations keep working
a7ctl = "camctl.cli:main"
a7ctl-mcp = "camctl.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
